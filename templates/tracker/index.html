{% extends 'tracker/base.html' %}
{% block content %}
<h2>Your Expenses</h2>
<a href="{% url 'add_expense' %}" class="btn btn-primary mb-3">Add Expense</a>
<h4>Total: ₹{{ total }}</h4>
<table class="table table-bordered">
  <thead><tr><th>Title</th><th>Amount</th><th>Category</th><th>Date</th><th>Edit</th></tr></thead>
  <tbody>
  {% for expense in expenses %}
    <tr>
      <td>{{ expense.title }}</td>
      <td>{{ expense.amount }}</td>
      <td>{{ expense.category }}</td>
      <td>{{ expense.date }}</td>
      <td><a href="{% url 'edit_expense' expense.id %}" class="btn btn-sm btn-warning">Edit</a></td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
